<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Armonia Hotel &amp; Spa</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    background: #f6f3ee;
    color: #2b2620;
    padding: 2rem;
  }
  main { max-width: 40rem; }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: 0.04em;
    margin: 0 0 0.5rem;
  }
  p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.1rem;
    color: #6b6255;
    margin: 0;
  }
  .divider {
    width: 3rem;
    height: 2px;
    background: #b89b6a;
    margin: 1.25rem auto;
  }
</style>
</head>
<body>
  <main>
    <h1>Villa Armonia</h1>
    <div class="divider"></div>
    <p>Hotel &amp; Spa — sitio en construcción.</p>
  </main>
</body>
</html>
